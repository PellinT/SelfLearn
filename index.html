<!DOCTYPE html>
<html lang="en">

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Social links profile</title>
</head>

<body>
  <div class="wrapper">
    <div class="profile-picture">

    <div class="Button">

      <Button>Intagram</Button>
    </div>

  </div>


</body>

</html>
